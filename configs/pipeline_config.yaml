# ============================================================================
# Korean Embedding Expansion for Qwen3-Embedding-0.6B
# 5-Stage Pipeline (Simplified & Optimized)
# ============================================================================
#
# Stage 1: Easy Tokens (30% easiest) - Curriculum Learning
# Stage 2: Medium Tokens (40% medium) - Curriculum Learning
# Stage 3: Hard Tokens (30% hardest) - Curriculum Learning
# Stage 4: Full Vocabulary Harmonization
# Stage 5: LoRA Fine-tuning (Optional - for semantic understanding)
#
# Note: Stage 6 removed - SimCSE loss destroys retrieval performance
# ============================================================================

project:
  name: "ko-qwen3-embedding-5stage"
  base_model: "Qwen/Qwen3-Embedding-0.6B"
  tokenizer_path: "outputs/koqwen-expanded"
  original_vocab_size: 151669
  expanded_vocab_size: 219698
  new_tokens_count: 67762

# ============================================================================
# Stage 1: Easy Tokens (30% easiest)
# ============================================================================
stage1:
  name: "Stage 1 - Easy Tokens"
  description: "High-frequency, simple structure tokens (Top 30% easiest)"

  train_new_tokens_only: true
  old_vocab_size: 151669

  curriculum:
    enabled: true
    difficulty_categories_path: "outputs/token_difficulty/token_categories.json"
    mode: "easy"
    priority_weight: 3.0

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "huggingface"
        max_samples: 300000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 200000

  training:
    num_epochs: 2
    batch_size: 48           # 2x from 24
    gradient_accumulation_steps: 2
    max_length: 192
    learning_rate: 3e-4
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: false

  checkpoint:
    output_dir: "checkpoints/stage1"
    save_steps: 2000
    save_total_limit: 2

  logging:
    log_steps: 100

# ============================================================================
# Stage 2: Medium Tokens (40% medium)
# ============================================================================
stage2:
  name: "Stage 2 - Medium Tokens"
  description: "Stem+affix tokens (Middle 40%)"

  train_new_tokens_only: true
  old_vocab_size: 151669

  curriculum:
    enabled: true
    difficulty_categories_path: "outputs/token_difficulty/token_categories.json"
    mode: "medium"
    priority_weight: 3.0

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "huggingface"
        max_samples: 300000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 200000

  training:
    num_epochs: 2
    batch_size: 32           # 2x from 16
    gradient_accumulation_steps: 2
    max_length: 192
    learning_rate: 2e-4
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: false

  checkpoint:
    output_dir: "checkpoints/stage2"
    save_steps: 2000
    save_total_limit: 2

  logging:
    log_steps: 100

# ============================================================================
# Stage 3: Hard Tokens (30% hardest)
# ============================================================================
stage3:
  name: "Stage 3 - Hard Tokens"
  description: "Complex morphology, low-frequency tokens (Bottom 30% hardest)"

  train_new_tokens_only: true
  old_vocab_size: 151669

  curriculum:
    enabled: true
    difficulty_categories_path: "outputs/token_difficulty/token_categories.json"
    mode: "hard"
    priority_weight: 4.0

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "huggingface"
        max_samples: 200000
      - name: "HAERAE-HUB/KOREAN-SyntheticText"
        source: "local"
        local_path: "~/haerae_dataset/KOREAN-SyntheticText"
        max_samples: 200000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 100000

  training:
    num_epochs: 2
    batch_size: 24           # 2x from 12
    gradient_accumulation_steps: 3
    max_length: 192
    learning_rate: 1e-4
    weight_decay: 0.01
    warmup_ratio: 0.15
    lr_scheduler_type: "cosine"
    max_grad_norm: 0.5

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: false

  checkpoint:
    output_dir: "checkpoints/stage3"
    save_steps: 2000
    save_total_limit: 2

  logging:
    log_steps: 100

# ============================================================================
# Stage 4: Full Vocabulary Harmonization
# ============================================================================
stage4:
  name: "Stage 4 - Full Vocabulary Harmonization"
  description: "Full vocabulary alignment (old + new tokens)"

  train_new_tokens_only: false

  curriculum:
    enabled: false

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "local"
        local_path: "~/haerae_dataset/KOREAN-WEBTEXT"
        max_samples: 200000
      - name: "HAERAE-HUB/KOREAN-SyntheticText"
        source: "local"
        local_path: "~/haerae_dataset/KOREAN-SyntheticText"
        max_samples: 150000
      - name: "HAERAE-HUB/KoSimpleEval"
        source: "local"
        local_path: "~/haerae_dataset/KoSimpleEval"
        max_samples: 50000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 100000

  training:
    num_epochs: 1
    batch_size: 24           # 2x from 12
    gradient_accumulation_steps: 3
    max_length: 192
    learning_rate: 5e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: false

  checkpoint:
    output_dir: "checkpoints/stage4"
    save_steps: 2000
    save_total_limit: 2

  logging:
    log_steps: 100

# ============================================================================
# Stage 5: LoRA Fine-tuning (Semantic Understanding)
# ============================================================================
stage5:
  name: "Stage 5 - LoRA Fine-tuning"
  description: "LoRA fine-tuning for semantic understanding (NLI + QA data)"

  use_lora: true
  lora_config:
    r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
    bias: "none"

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 300000
      - name: "HAE-RAE-COT"
        source: "local"
        local_path: "~/haerae_dataset/HAE-RAE-COT"
        max_samples: 200000

  training:
    num_epochs: 1
    batch_size: 20           # 2x from 10
    gradient_accumulation_steps: 4
    max_length: 256
    learning_rate: 5e-5
    weight_decay: 0.01
    warmup_ratio: 0.05
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: true

  checkpoint:
    output_dir: "checkpoints/stage5"
    save_steps: 2000
    save_total_limit: 2

  logging:
    log_steps: 100

# ============================================================================
# Hardware Settings (8 GPUs: 1-8)
# ============================================================================
hardware:
  num_gpus: 8
  gpu_ids: [1, 2, 3, 4, 5, 6, 7, 8]
  gpu_type: "A100"
  gpu_memory_gb: 80
  distributed_backend: "nccl"

# ============================================================================
# MTEB Evaluation Tasks (Korean Retrieval)
# ============================================================================
evaluation:
  mteb_tasks:
    - task: "Ko-StrategyQA"
      subset: "default"
      type: "retrieval"
    - task: "AutoRAGRetrieval"
      subset: "default"
      type: "retrieval"
    - task: "BelebeleRetrieval"
      subset: "kor_Hang-kor_Hang"
      type: "retrieval"
    - task: "BelebeleRetrieval"
      subset: "kor_Hang-eng_Latn"
      type: "retrieval"
    - task: "BelebeleRetrieval"
      subset: "eng_Latn-kor_Hang"
      type: "retrieval"
    - task: "PublicHealthQA"
      subset: "korean"
      type: "retrieval"
  batch_size: 64
  output_dir: "evaluation_results"
