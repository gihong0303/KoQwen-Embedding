# ============================================================================
# Korean Embedding Expansion for Qwen3-Embedding-0.6B
# HYBRID 7-Stage Pipeline: CLSA + JLCE + MCL + Contrastive
# ============================================================================
#
# Stage 0: Cross-lingual Semantic Anchoring (CLSA)
# Stage 1-3: Jamo-Level Compositional Embedding (JLCE) + Morphological Curriculum Learning (MCL)
# Stage 4-6: Standard Contrastive Learning with LoRA
#
# ============================================================================

project:
  name: "ko-qwen3-embedding-hybrid-7stage"
  base_model: "Qwen/Qwen3-Embedding-0.6B"  # Main embedding model for training
  tokenizer_path: "outputs/koqwen-expanded"
  original_vocab_size: 151669
  expanded_vocab_size: 219698
  new_tokens_count: 67762

# Global settings for Korean-specific methods
korean_specific:
  # Jamo-Level Compositional Embedding (JLCE)
  jlce:
    enabled: true
    composition_type: "mlp"  # 'mlp', 'attention', 'weighted_sum'
    use_position_encoding: true
    blend_ratio: 0.5  # JLCE vs existing embedding blend

  # Morphological Curriculum Learning (MCL)
  mcl:
    enabled: true
    use_mecab: true  # MeCab-ko for morphological analysis
    cache_path: "outputs/morphological_curriculum/token_categories.json"

# ============================================================================
# Stage 0: Cross-lingual Semantic Anchoring (CLSA) - NEW!
# ============================================================================
stage0:
  name: "Stage 0 - Cross-lingual Semantic Anchoring (CLSA)"
  description: "새 한국어 토큰을 영어/중국어 의미 공간에 정렬"

  train_new_tokens_only: true
  old_vocab_size: 151669

  dataset:
    bilingual_dict_path: "outputs/bilingual_dictionary.json"
    min_anchors: 2  # Minimum number of cross-lingual anchors per token

  # CLSA-specific settings
  diversity_weight: 0.1  # Regularization to prevent token collapse
  distance_type: "cosine"  # 'cosine' or 'euclidean'

  training:
    num_epochs: 3
    batch_size: 128  # Large batch for diverse token pairs
    gradient_accumulation_steps: 2
    learning_rate: 5e-4  # Higher LR for initial alignment
    weight_decay: 0.01
    warmup_ratio: 0.2
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"

  checkpoint:
    output_dir: "checkpoints/stage0"
    save_steps: 500
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Stage 1: Easy Tokens with JLCE + MCL (30% easiest)
# ============================================================================
stage1:
  name: "Stage 1 - Easy Tokens (JLCE + MCL)"
  description: "단일 어근, 빈도 높은 토큰 학습 (Top 30% easiest)"

  trainable_params:
    - "model.embed_tokens"
  freeze_params:
    - "model.layers"

  train_new_tokens_only: true
  old_vocab_size: 151669

  # JLCE + MCL Combined Loss Settings
  jlce_mcl:
    enabled: true
    jamo_weight: 0.5      # Stage 1: 자모 임베딩 강조
    curriculum_weight: 0.2
    contrastive_weight: 0.3

  # Morphological curriculum (stem only)
  curriculum:
    enabled: true
    difficulty_categories_path: "outputs/morphological_curriculum/token_categories.json"
    mode: "easy"  # 단일 어근 (예: 집, 학교, 먹다)
    priority_weight: 3.0

  contrastive:
    temperature: 0.05
    pooling: "mean"

  # Enhanced dataset with KorNLI
  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "huggingface"
        max_samples: 150000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 100000

  training:
    num_epochs: 2
    batch_size: 24
    gradient_accumulation_steps: 3
    max_length: 192
    learning_rate: 3e-4
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: false

  checkpoint:
    output_dir: "checkpoints/stage1_jlce_mcl"
    save_steps: 1000
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Stage 2: Medium Tokens with JLCE + MCL (40% medium)
# ============================================================================
stage2:
  name: "Stage 2 - Medium Tokens (JLCE + MCL)"
  description: "어근+조사 토큰 학습 (Middle 40%)"

  trainable_params:
    - "model.embed_tokens"
  freeze_params:
    - "model.layers"

  train_new_tokens_only: true
  old_vocab_size: 151669

  # JLCE + MCL Combined Loss Settings
  jlce_mcl:
    enabled: true
    jamo_weight: 0.4      # Stage 2: 균형 잡힌 가중치
    curriculum_weight: 0.3
    contrastive_weight: 0.3

  # Morphological curriculum (stem + affix)
  curriculum:
    enabled: true
    difficulty_categories_path: "outputs/morphological_curriculum/token_categories.json"
    mode: "medium"  # 어근+조사 (예: 집에, 학교로, 먹고)
    priority_weight: 3.0

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "huggingface"
        max_samples: 150000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 100000

  training:
    num_epochs: 1
    batch_size: 16
    gradient_accumulation_steps: 4
    max_length: 192
    learning_rate: 2e-4
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"

  checkpoint:
    output_dir: "checkpoints/stage2_jlce_mcl"
    save_steps: 1000
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Stage 3: Hard Tokens with JLCE + MCL (30% hardest)
# ============================================================================
stage3:
  name: "Stage 3 - Hard Tokens (JLCE + MCL)"
  description: "복합 형태, 저빈도 토큰 학습 (Bottom 30% hardest)"

  trainable_params:
    - "model.embed_tokens"
  freeze_params:
    - "model.layers"

  train_new_tokens_only: true
  old_vocab_size: 151669

  # JLCE + MCL Combined Loss Settings
  jlce_mcl:
    enabled: true
    jamo_weight: 0.3      # Stage 3: 형태소 커리큘럼 강조
    curriculum_weight: 0.4
    contrastive_weight: 0.3

  # Morphological curriculum (complex forms)
  curriculum:
    enabled: true
    difficulty_categories_path: "outputs/morphological_curriculum/token_categories.json"
    mode: "hard"  # 복합 구조 (예: 학교에서부터, 먹지않았다)
    priority_weight: 4.0  # Higher weight for rare tokens

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-SyntheticText"
        source: "local"
        local_path: "~/haerae_dataset/KOREAN-SyntheticText"
        max_samples: 100000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 50000

  training:
    num_epochs: 1
    batch_size: 12
    gradient_accumulation_steps: 5
    max_length: 192
    learning_rate: 1e-4  # Lower LR for hard tokens (more careful)
    weight_decay: 0.01
    warmup_ratio: 0.15
    lr_scheduler_type: "cosine_with_restarts"
    max_grad_norm: 0.5  # Smaller gradient clipping

  optimization:
    mixed_precision: "bf16"

  checkpoint:
    output_dir: "checkpoints/stage3_jlce_mcl"
    save_steps: 1000
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Stage 4: Full Vocabulary Harmonization
# ============================================================================
stage4:
  name: "Stage 4 - Full Vocabulary Harmonization"
  description: "전체 vocabulary harmonization (old + new) with diverse data"

  trainable_params:
    - "model.embed_tokens"  # 전체 토큰!
  freeze_params:
    - "model.layers"

  train_new_tokens_only: false  # 전체 학습

  curriculum:
    enabled: false  # No curriculum for stage 4

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAERAE-HUB/KOREAN-WEBTEXT"
        source: "local"
        local_path: "~/haerae_dataset/KOREAN-WEBTEXT"
        max_samples: 100000
      - name: "HAERAE-HUB/KOREAN-SyntheticText"
        source: "local"
        local_path: "~/haerae_dataset/KOREAN-SyntheticText"
        max_samples: 60000
      - name: "HAERAE-HUB/KoSimpleEval"
        source: "local"
        local_path: "~/haerae_dataset/KoSimpleEval"
        max_samples: 20000
      - name: "kakaobrain/kor_nli"
        source: "huggingface"
        split: "train"
        max_samples: 20000

  training:
    num_epochs: 1
    batch_size: 12
    gradient_accumulation_steps: 5
    max_length: 192
    learning_rate: 5e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"

  checkpoint:
    output_dir: "checkpoints/stage4"
    save_steps: 1000
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Stage 5: Transformer Enhancement with LoRA
# ============================================================================
stage5:
  name: "Stage 5 - Transformer Enhancement with LoRA"
  description: "LoRA로 Transformer 레이어 학습 (Reasoning data)"

  use_lora: true
  lora_config:
    r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
    bias: "none"

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    mixed:
      - name: "HAE-RAE-COT"
        source: "local"
        local_path: "~/haerae_dataset/HAE-RAE-COT"
        max_samples: 100000
      - name: "HR-Instruct-Math"
        source: "local"
        local_path: "~/haerae_dataset/HR-Instruct-Math"
        max_samples: 100000

  training:
    num_epochs: 1
    batch_size: 10
    gradient_accumulation_steps: 6
    max_length: 192
    learning_rate: 5e-5
    weight_decay: 0.01
    warmup_ratio: 0.05
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: true

  checkpoint:
    output_dir: "checkpoints/stage5"
    save_steps: 1000
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Stage 6: Advanced Contrastive Learning
# ============================================================================
stage6:
  name: "Stage 6 - Advanced Contrastive Learning"
  description: "SimCSE++ 고급 대조 학습 (High quality feedback)"

  use_lora: true
  lora_config:
    r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
    bias: "none"

  contrastive:
    temperature: 0.05
    pooling: "mean"

  dataset:
    local: true
    local_path: "~/haerae_dataset"
    name: "K2-Feedback"
    min_score: 5
    max_samples: 150000

  training:
    num_epochs: 2
    batch_size: 12
    gradient_accumulation_steps: 5
    max_length: 192
    learning_rate: 3e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    max_grad_norm: 1.0

  optimization:
    mixed_precision: "bf16"
    gradient_checkpointing: true

  checkpoint:
    output_dir: "checkpoints/stage6"
    save_steps: 1000
    save_total_limit: 2

  logging:
    log_steps: 50

# ============================================================================
# Hardware Settings (A5000 x6)
# ============================================================================
hardware:
  num_gpus: 6
  gpu_ids: [4, 5, 6, 7, 8, 9]
  gpu_type: "A5000"
  gpu_memory_gb: 24
  distributed_backend: "nccl"

environment:
  CUDA_VISIBLE_DEVICES: "4,5,6,7,8,9"
  TOKENIZERS_PARALLELISM: "false"
  NCCL_IB_DISABLE: "1"
  NCCL_P2P_DISABLE: "1"
  NCCL_SHM_DISABLE: "1"
  TORCH_NCCL_BLOCKING_WAIT: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  NCCL_DEBUG: "WARN"
  NCCL_SOCKET_FAMILY: "AF_INET"
